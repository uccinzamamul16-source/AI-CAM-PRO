name: Android Debug Build

on:
  push:
    branches: [ "main", "free-ai-tryon-webview" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build AI CAM PRO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK structure, manifest and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" | tail -n 2
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee apk-badging.txt
          "$BT/zipalign" -c -v 4 "$APK"
          grep -q "package: name='com.dreamhome.aicampro'" apk-badging.txt

      - name: Upload debug APK and install diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: AI-CAM-PRO-debug-verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          if-no-files-found: error
